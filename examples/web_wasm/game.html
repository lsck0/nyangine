<!doctype html>
<!--
  The game slice, live: the engine's 2D render path — a moving, interactive scene — drawn to a real WebGL2
  canvas by the wasm module `nyangine_game.{js,wasm}` that `./build wasm-game` builds. The module stands up
  the SDL_GPU → GLES3 shim (src/nyangine/renderer/gpu_gles) and drives the engine's real nya_render2d_* API
  over it — nya_render2d_rect_rotated, nya_render2d_texture_ex, nya_render2d_circle + nya_render2d_flush,
  compiled verbatim from render2d.c — so the browser is just another GPU backend under the shipping 2D
  renderer. Browser input reaches the scene through the canvas input seam (platform/web/web_input.c): the
  page's mouse and key events become engine NYA_Events the scene consumes.

  Controls: WASD or the arrow keys steer the big sprite; move the mouse to drag the cursor ring; click to
  spawn a bouncing sprite.

  Contrast web/ui.html, which renders the immediate-mode UI to the DOM with no GPU. Here there is a real
  WebGL2 context and real draw calls.

  Serve it, do not open it as a file:// — a wasm module is fetched over HTTP. From the repo root, after
  `./build wasm-game`:

      python3 -m http.server -d web 8000     # then open http://localhost:8000/game.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nyangine · game</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --bg:#0f1116; --ink:#d8dbe2; --dim:#9498a2; --accent:#5a7cff; }
      html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
      #wrap { display:flex; flex-direction:column; align-items:center; gap:12px; padding:20px 16px; box-sizing:border-box; }
      h1 { font-size:16px; font-weight:600; margin:0; color:var(--ink); }
      /* The one canvas the shim binds by the selector "#canvas". A backing store is set from JS to match
         its display size, so the drawing buffer is 1:1 with CSS pixels. */
      #canvas { width:min(640px, 92vw); aspect-ratio:4/3; background:#000; border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.35); display:block; }
      #status { font:12px/1.4 ui-monospace,Menlo,Consolas,monospace; color:var(--dim); text-align:center; max-width:640px; }
      #status .err { color:#ff7b72; }
      #status .ok { color:#7ee787; }
      #hint { font:12px/1.4 system-ui,sans-serif; color:var(--dim); text-align:center; margin:0; }
      /* The canvas takes keyboard focus so WASD/arrows reach it; a focus ring would fight the scene, so drop it. */
      #canvas:focus { outline:2px solid var(--accent); outline-offset:3px; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <h1>nyangine · interactive 2D scene on WebGL2</h1>
      <canvas id="canvas" tabindex="0"></canvas>
      <p id="status">loading…</p>
      <p id="hint">WASD / arrows steer the sprite · mouse drags the cursor ring · click spawns a bouncer</p>
    </div>

    <script>
      const canvas = document.getElementById("canvas");
      const status = document.getElementById("status");

      // Match the drawing buffer to the displayed size, so the sprite lands where the ortho places it.
      function sizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const w = Math.max(1, Math.round(rect.width));
        const h = Math.max(1, Math.round(rect.height));
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      }
      sizeCanvas();
      window.addEventListener("resize", sizeCanvas);

      // Emscripten emits this loader beside nyangine_game.wasm. MODULARIZE means it defines a factory
      // rather than running on load, so the page decides when to instantiate — after the canvas exists.
      var Module = { canvas: canvas };
    </script>
    <script src="./nyangine_game.js"></script>
    <script>
      createNyangineGameModule({ canvas: canvas })
        .then((Module) => {
          // main() already ran setup, the self-checks, attached the canvas input, and registered the render
          // loop. Read the checks back for a status line: 1 means the shim ran each frame in the right order.
          const frame = Module.cwrap("nyangine_game_selfcheck", "number", [])() === 1;
          const scene = Module.cwrap("nyangine_game_scene_selfcheck", "number", [])() === 1;
          canvas.focus(); // so the keys reach the scene without a click first
          status.innerHTML = (frame && scene)
            ? '<span class="ok">running</span> — the interactive 2D scene is drawing through the SDL_GPU→GLES3 shim on a live WebGL2 canvas.'
            : '<span class="err">a shim self-check did not match — see the console.</span>';
        })
        .catch((error) => {
          status.innerHTML = '<span class="err">failed to load the wasm module — is it served over HTTP, and has ./build wasm-game run?</span> ' + String(error);
        });
    </script>
  </body>
</html>
