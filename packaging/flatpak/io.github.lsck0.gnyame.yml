id: io.github.lsck0.gnyame
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: gnyame

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # the gpu and gamepads.
  - --device=all

modules:
  # The release archive rather than a source build: the runtime's glibc and OpenSSL are newer than
  # the ones the release is linked against, so the same binary runs here on any distribution.
  - name: gnyame
    buildsystem: simple
    rename-desktop-file: gnyame.desktop
    rename-icon: gnyame
    build-commands:
      - install -Dm755 gnyame /app/bin/gnyame
      - install -Dm644 gnyame.desktop /app/share/applications/gnyame.desktop
      - install -Dm644 gnyame.png /app/share/icons/hicolor/48x48/apps/gnyame.png
      - install -Dm644 io.github.lsck0.gnyame.metainfo.xml /app/share/metainfo/io.github.lsck0.gnyame.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/gnyame/LICENSE
      - install -Dm644 CHANGELOG.md /app/share/doc/gnyame/CHANGELOG.md
      # /app is read only, so these are the defaults a first run copies into the player's own data
      # directory, not the files they edit. See data/README.md.
      - cp -r data /app/share/gnyame/data
      - cp -r plugins /app/share/gnyame/plugins
    sources:
      - type: archive
        url: https://github.com/lsck0/nyangine/releases/download/v@VERSION@/gnyame.@VERSION@.linux-x86_64.tar.gz
        sha256: @SHA256_LINUX@
        # The archive carries its contents at its root, so there is no leading component to strip.
        strip-components: 0
      - type: file
        path: io.github.lsck0.gnyame.metainfo.xml
