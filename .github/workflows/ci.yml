name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here needs the API. Denying everything means a step that later does fails loudly instead of
# inheriting the repository default, which is often `write`.
permissions: {}

jobs:
  # Vendors build once per cache key here and are saved before anything else runs, so the jobs below
  # restore them instead of each compiling the same hour of dependencies in parallel.
  vendor-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: true
          # The token is only needed to clone. Left in .git/config it travels into anything that
          # archives the workspace, and nothing here pushes.
          persist-credentials: false

      - uses: ./.github/actions/setup-linux
        with:
          llvm-version: 22

      # DXC does not build under MinGW, so the Windows jobs use these instead of compiling their own.
      - name: Compile shaders
        run: ./build build shaders

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled-shaders
          path: assets/shader/compiled/
          if-no-files-found: error
          retention-days: 1

  check-linux:
    needs: vendor-linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: true
          # The token is only needed to clone. Left in .git/config it travels into anything that
          # archives the workspace, and nothing here pushes.
          persist-credentials: false

      - uses: ./.github/actions/setup-linux
        with:
          llvm-version: 22

      # No clang-format gate yet: the tree does not satisfy its own .clang-format today, so turning this
      # on means one reformatting commit across every source file first. Worth doing, not worth hiding
      # inside an unrelated change.
      - name: Static analysis
        run: ./build check --strict

      # Committed submodule SHAs only. A submodule whose recorded commit is not reachable from its
      # remote is either force-pushed history or a local commit nobody else can check out.
      - name: Submodule pins are reachable
        run: |
          git submodule foreach --quiet --recursive \
            'git cat-file -e "$sha1" || { echo "::error::$name pin $sha1 is unreachable"; exit 1; }'

  test-linux:
    needs: vendor-linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: true
          # The token is only needed to clone. Left in .git/config it travels into anything that
          # archives the workspace, and nothing here pushes.
          persist-credentials: false

      - uses: ./.github/actions/setup-linux
        id: setup
        with:
          llvm-version: 22
          ccache-key: test

      - name: Run tests
        run: ./build run test

      - name: Report compiler cache statistics
        if: always() && steps.setup.outputs.ccache-cache-key != ''
        run: ccache --show-stats

      # even after a failure, so the objects that did compile are kept.
      - name: Save compiler cache
        if: always() && steps.setup.outputs.ccache-cache-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.ccache-dir }}
          key: ${{ steps.setup.outputs.ccache-cache-key }}

  build-linux:
    needs: vendor-linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: true
          # The token is only needed to clone. Left in .git/config it travels into anything that
          # archives the workspace, and nothing here pushes.
          persist-credentials: false

      - uses: ./.github/actions/setup-linux
        id: setup
        with:
          llvm-version: 22
          ccache-key: build

      # Linux, Windows and Steam Windows, the last two cross compiled.
      - name: Build release targets
        run: ./build build release

      # Every distribution but the Steam Linux one, which has a job of its own because it needs the
      # sniper sysroot. This is what a release runs, so a manifest template that stopped rendering or
      # an archive that stopped being produced fails here rather than during a tag.
      # One invocation, not one per target: a run is the unit a checksum is consistent over, since
      # each one rebuilds and rearchives what it stages.
      - name: Stage the distributions
        run: >
          ./build dist
          linux windows steam-windows lua-api
          linux-pacman linux-nixos linux-flatpak windows-winget windows-scoop

      - name: Check what was staged
        run: |
          for file in dist/steam-windows/gnyame.exe dist/steam-windows/steam_api64.dll \
                      dist/linux/gnyame dist/windows/gnyame.exe \
                      dist/linux/data/settings.nya dist/linux/plugins/example/manifest.nya \
                      dist/linux/CHANGELOG.md dist/SHA256SUMS; do
            [ -f "${file}" ] || { echo "::error::${file} is missing"; exit 1; }
          done

          # A template token left in a rendered manifest means a substitution was dropped, which ships
          # a package recipe pointing at a url with "@VERSION@" in it.
          if grep -rn '@VERSION@\|@SHA256_LINUX@\|@SHA256_WINDOWS@\|@DATE@' dist/; then
            echo "::error::a package manifest was staged with its template tokens unfilled"
            exit 1
          fi

      - name: Report compiler cache statistics
        if: always() && steps.setup.outputs.ccache-cache-key != ''
        run: ccache --show-stats

      # even after a failure, so the objects that did compile are kept.
      - name: Save compiler cache
        if: always() && steps.setup.outputs.ccache-cache-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.ccache-dir }}
          key: ${{ steps.setup.outputs.ccache-cache-key }}

  # The Steam Linux Runtime build: every vendor again against the sniper SDK sysroot, cached apart from the
  # others, then the game, checked against the runtime's glibc and started inside Valve's sniper image.
  build-steam-linux:
    needs: vendor-linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: true
          # The token is only needed to clone. Left in .git/config it travels into anything that
          # archives the workspace, and nothing here pushes.
          persist-credentials: false

      - uses: ./.github/actions/setup-linux
        id: setup
        with:
          llvm-version: 22
          ccache-key: steam-linux

      - uses: ./.github/actions/setup-steamrt
        with:
          llvm-version: 22

      - name: Stage the Steam Linux distribution
        run: ./build dist steam-linux

      # Through `dist`, so CI exercises the staging every release goes through rather than only the
      # compile that feeds it. A distribution that builds but cannot be staged is still broken.
      - name: Verify the Steam Linux depot
        run: packaging/steam/verify-linux.sh dist/steam-linux

      - name: Report compiler cache statistics
        if: always() && steps.setup.outputs.ccache-cache-key != ''
        run: ccache --show-stats

      # even after a failure, so the objects that did compile are kept.
      - name: Save compiler cache
        if: always() && steps.setup.outputs.ccache-cache-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.ccache-dir }}
          key: ${{ steps.setup.outputs.ccache-cache-key }}

  # The workflows audit themselves on every push and pull request: zizmor reads .github/workflows for the
  # mistakes a human review misses — an unpinned action, an over-broad token, a script-injection sink. On
  # the per-push path (scheduled.yml runs the same check nightly) so a regression in a workflow is caught
  # in the change that introduces it. Advisory: SARIF upload is off, which would need security-events: write.
  workflow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit the workflows with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Scan the workflow directory; do not upload SARIF, which would need security-events: write.
          advanced-security: false
          inputs: .github/workflows/

  # The Windows host path, which the Linux jobs above cannot cover.
  #
  # They cross compile the Windows target with mingw-w64, which exercises on_linux/build_windows.h and
  # nothing in on_windows/: the toolchain file, native windres, autotools vendors under sh and make,
  # and signtool.
  #
  # MSYS2 is slow to bring up and builds every vendor natively, hence the longer timeout.
  vendor-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: true
          # The token is only needed to clone. Left in .git/config it travels into anything that
          # archives the workspace, and nothing here pushes.
          persist-credentials: false

      - uses: ./.github/actions/setup-windows
        with:
          llvm-version: 22

  test-windows:
    needs: [vendor-windows, vendor-linux]
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: true
          # The token is only needed to clone. Left in .git/config it travels into anything that
          # archives the workspace, and nothing here pushes.
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-shaders
          path: assets/shader/compiled/

      - uses: ./.github/actions/setup-windows
        id: setup
        with:
          llvm-version: 22
          ccache-key: test

      - name: Run tests
        run: ./build.exe run test

      - name: Report compiler cache statistics
        if: always() && steps.setup.outputs.ccache-cache-key != ''
        run: ccache --show-stats

      # even after a failure, so the objects that did compile are kept.
      - name: Save compiler cache
        if: always() && steps.setup.outputs.ccache-cache-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.ccache-dir }}
          key: ${{ steps.setup.outputs.ccache-cache-key }}

  build-windows:
    needs: [vendor-windows, vendor-linux]
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: true
          # The token is only needed to clone. Left in .git/config it travels into anything that
          # archives the workspace, and nothing here pushes.
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiled-shaders
          path: assets/shader/compiled/

      - uses: ./.github/actions/setup-windows
        id: setup
        with:
          llvm-version: 22
          ccache-key: build

      # On this host `release` is the Windows and Steam Windows executables; there is no Linux target to ask for.
      - name: Build release targets
        run: ./build.exe build release

      - name: Report the produced executables
        run: |
          exe=$(ls gnyame.*.windows-x86_64.exe) || { echo "::error::no windows executable was produced"; exit 1; }
          echo "built ${exe} ($(stat -c%s "${exe}") bytes)"

          depot="$(ls -d gnyame.*.steam-windows-x86_64)" || { echo "::error::no steam windows depot was produced"; exit 1; }
          for file in gnyame.exe steam_api64.dll; do
            [ -f "${depot}/${file}" ] || { echo "::error::${depot}/${file} is missing"; exit 1; }
          done
          echo "built ${depot}/gnyame.exe ($(stat -c%s "${depot}/gnyame.exe") bytes)"

          # Informational, not a gate. signtool lives in a versioned Windows SDK directory, not on
          # PATH, so the signing hook usually skips here. Reported so a missing signature is visible.
          if command -v signtool >/dev/null 2>&1; then
            signtool verify /pa "${exe}" \
              || echo "::notice::signed, publisher untrusted (expected for the sample certificate)"
          else
            echo "::notice::signtool not on PATH, executable is unsigned"
          fi

      - name: Report compiler cache statistics
        if: always() && steps.setup.outputs.ccache-cache-key != ''
        run: ccache --show-stats

      # even after a failure, so the objects that did compile are kept.
      - name: Save compiler cache
        if: always() && steps.setup.outputs.ccache-cache-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.ccache-dir }}
          key: ${{ steps.setup.outputs.ccache-cache-key }}
