name: CD

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

# Denied at the top and granted per job, so the release job's `contents: write` is the only write
# anything in this file has, and it says so where it is used.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          lfs: true
          # Whole history, for the version and commit the build stamps into the binary.
          fetch-depth: 0
          # Reading git locally needs no credentials, and nothing pushes; the release job writes
          # through the API.
          persist-credentials: false

      - uses: ./.github/actions/setup-linux
        with:
          llvm-version: 22

      # The package manifests point at release urls built from the version, so a tag that disagrees
      # with the VERSION the binaries are named after would publish manifests for files that do not exist.
      - name: Check the tag matches VERSION
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^#define VERSION *"\([^"]*\)".*/\1/p' src/build/flags.h)"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match VERSION ${version} in src/build/flags.h"
            exit 1
          fi

      - name: Build release targets
        run: ./build build release

      # CI saves the cache this restores; a tag rarely changes the vendors, and a miss only costs time.
      - uses: ./.github/actions/setup-steamrt
        with:
          llvm-version: 22
          save: "false"

      - name: Build the Steam Linux target
        run: |
          ./build build steam-linux
          packaging/steam/verify-linux.sh "$(ls -d gnyame.*.steam-linux-x86_64)"

      # `release` on this host cross compiles both Windows targets too, so all four artifacts exist here and
      # there is no second job to collect from.
      - name: Collect artifacts
        run: |
          packaging/dist.sh
          ls -l dist

      # Notes come from the commits since the previous tag. Hand written notes go stale against the
      # history they claim to describe; generated ones cannot.
      - name: Generate release notes
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"

          {
            echo "## ${TAG}"
            echo
            if [ -n "${previous}" ]; then
              echo "Changes since ${previous}:"
              echo
              git log --no-merges --pretty='- %s' "${previous}..${TAG}"
            else
              echo "First tagged release."
            fi
            echo
            echo '## Checksums'
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > release-notes.md

          cat release-notes.md

      # The gh CLI rather than a marketplace action: it ships on the runner, so this adds no third
      # party dependency to pin, and the same command runs locally against the same API.
      # A manual run on a branch stops after collecting, as a dry run of everything above.
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file release-notes.md \
            dist/*
