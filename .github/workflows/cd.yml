name: CD

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

# Denied at the top and granted per job, so the release job's `contents: write` is the only write
# anything in this file has, and it says so where it is used.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    # At job level so the signing step can be skipped on `env.GPG_PRIVATE_KEY == ''`: a secret cannot
    # be read in a step level `if:`, but an environment variable holding one can.
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: true
          # Whole history, for the version and commit the build stamps into the binary, and for the
          # changelog, which is generated from every commit since the previous tag.
          fetch-depth: 0
          # Reading git locally needs no credentials, and nothing pushes; the release job writes
          # through the API.
          persist-credentials: false

      - uses: ./.github/actions/setup-linux
        with:
          llvm-version: 22

      # After setup, which bootstraps ./build: the version comes out of the build system rather than
      # out of a regex over one of its headers, so the tag is checked against the same value the
      # artifacts are named after and the manifests point at.
      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(./build version)"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match version ${version}; bump VERSION in src/nyangine-build/flags.h"
            exit 1
          fi

      # The signing certificate, decrypted to the runner's temporary directory rather than the
      # workspace, which is archived. Skipped without the secrets, so a fork still builds and the
      # release is signed by the sample certificate instead of failing. See secrets/README.md.
      - name: Decrypt the signing certificate
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          if [ ! -f secrets/signing.pfx.enc ]; then
            echo "::notice::no secrets/signing.pfx.enc, building with the sample certificate"
            exit 0
          fi

          # Pinned, like every other tool this repository depends on. The runner has gpg already.
          sops_version=3.12.0
          curl -fsSL -o "${RUNNER_TEMP}/sops" \
            "https://github.com/getsops/sops/releases/download/v${sops_version}/sops-v${sops_version}.linux.amd64"
          chmod +x "${RUNNER_TEMP}/sops"

          printf '%s' "${GPG_PRIVATE_KEY}" | base64 -d | gpg --batch --quiet --import
          "${RUNNER_TEMP}/sops" --decrypt --input-type binary --output-type binary \
            secrets/signing.pfx.enc > "${RUNNER_TEMP}/signing.pfx"

          # Through the environment, which is what flags.h documents these three overrides for. The
          # password never reaches a command line, where it would be visible to every process.
          {
            echo "NYA_SIGNING_PFX=${RUNNER_TEMP}/signing.pfx"
            echo "NYA_SIGNING_PASSWORD=${GPG_PASSPHRASE}"
          } >> "$GITHUB_ENV"

      # The sniper SDK sysroot and its vendors, so `dist` can build the Steam Linux target below. CI
      # saves the cache this restores; a tag rarely changes the vendors, and a miss only costs time.
      - uses: ./.github/actions/setup-steamrt
        with:
          llvm-version: 22
          save: "false"

      # One command, and the same one a developer runs. It builds every release target this host can
      # produce — Linux, Windows and both Steam depots, the last two cross compiled — stages each
      # distribution, regenerates the changelog, renders every package manifest with this version and
      # the real archive checksums, and writes SHA256SUMS over the lot.
      #
      # That is what makes a packager's job possible: pacman, nix, flatpak, winget and scoop all come
      # out of this run pointing at files it just hashed.
      - name: Stage every distribution
        run: ./build dist

      - name: Verify the Steam Linux depot
        run: packaging/steam/verify-linux.sh dist/steam-linux

      - name: Report what was staged
        run: |
          find dist -maxdepth 1 -printf '%f\n' | sort
          cat dist/SHA256SUMS

      # The same generator that writes CHANGELOG.md, asked for one section instead of the file. Notes
      # and changelog cannot describe the same tag differently, because there is only one of them.
      - name: Generate release notes
        if: github.ref_type == 'tag'
        run: |
          {
            ./build changelog --release
            echo
            echo '## Checksums'
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > "${RUNNER_TEMP}/release-notes.md"

          cat "${RUNNER_TEMP}/release-notes.md"

      # The gh CLI rather than a marketplace action: it ships on the runner, so this adds no third
      # party dependency to pin, and the same command runs locally against the same API.
      # A manual run on a branch stops after staging, as a dry run of everything above.
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            dist/SHA256SUMS dist/*.tar.gz dist/*.zip
