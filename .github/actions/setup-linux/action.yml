name: Setup (Linux)
description: Install build dependencies, setup caching, bootstrap build system.

inputs:
  llvm-version:
    description: LLVM major version to install from apt.llvm.org.
    required: false
    default: "22"

runs:
  using: composite

  steps:
    # Downloaded packages go to a directory the runner user owns. actions/cache restores as that user,
    # and extracting into root-owned /var/cache/apt/archives failed with "Permission denied", so the
    # cache never restored anything.
    - name: Keep downloaded packages
      shell: bash
      run: |
        mkdir -p "${HOME}/.apt-archives/partial"
        {
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";'
          echo "Dir::Cache::Archives \"${HOME}/.apt-archives\";"
        } | sudo tee /etc/apt/apt.conf.d/99keep-downloads > /dev/null

    # The version arrives through the environment rather than being pasted into the script. A `${{ }}`
    # inside a `run:` block is expanded *before* the shell sees the text, so an input carrying a quote
    # or a semicolon stops being a value and becomes source. It is hardcoded by both workflows today;
    # the point is that a composite action is reusable and cannot assume its next caller is careful.
    - name: Add apt.llvm.org repository
      shell: bash
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
      run: |
        codename="$(lsb_release -cs)"
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
        echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${LLVM_VERSION} main" \
          | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null

    - name: Cache apt packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.apt-archives/*.deb
        key: apt-${{ runner.os }}-llvm${{ inputs.llvm-version }}-${{ hashFiles('.github/ci-packages.txt') }}

    - name: Install packages
      shell: bash
      run: |
        sudo apt-get update
        mapfile -t packages < <(grep -vE '^\s*(#|$)' .github/ci-packages.txt)
        sudo apt-get install -y --no-install-recommends "${packages[@]}"

    - name: Select pinned LLVM as the default toolchain
      shell: bash
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
      run: |
        # /usr/local/bin precedes /usr/bin in PATH, so these shadow the runner
        # image's preinstalled clang without fighting dpkg-owned symlinks.
        #
        # Every LLVM tool the build system calls unversioned: llvm-profdata and llvm-cov (test.c),
        # clang-format (asset.c) and clang-tidy (check.c). apt installs none under a bare name.
        for tool in clang clang++ clang-format clang-tidy lld ld.lld llvm-ar llvm-cov llvm-profdata llvm-ranlib llvm-strip; do
          versioned="/usr/bin/${tool}-${LLVM_VERSION}"
          if [ -x "$versioned" ]; then
            sudo ln -sf "$versioned" "/usr/local/bin/${tool}"
          else
            echo "::error::${versioned} not found"
            exit 1
          fi
        done
        hash -r
        clang --version
        ld.lld --version
        clang --version | grep -q "clang version ${LLVM_VERSION}\." \
          || { echo "::error::clang is not LLVM ${LLVM_VERSION}"; exit 1; }

    - name: Compute vendor cache key
      id: vendor
      shell: bash
      run: |
        # Every submodule revision, plus the recipes and toolchains that configure them, since a
        # changed cmake flag produces a different archive from identical sources.
        revisions="$(git submodule status --recursive vendor)"
        recipes="$(find src/build/vendor src/build/on_linux src/build/on_windows -type f -name '*.h' -print0 | sort -z | xargs -0 sha256sum)"
        sha="$(printf '%s\n%s' "${revisions}" "${recipes}" | sha256sum | cut -d' ' -f1)"
        echo "sha=${sha}" >> "$GITHUB_OUTPUT"

    # Restored here and saved right after the vendor build, not at job end, so a failing test or a
    # cancelled run still keeps the vendors it built.
    - name: Restore vendor builds
      id: vendor-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        # Every configured build tree, plus the two Makefile vendors that build in tree and park a
        # renamed archive one directory up. luajit.h and sqlite-vec.h are generated and untracked;
        # the build skips the rules that create them once the archives exist, so they are cached too.
        path: |
          vendor/*/build-linux-x86_64
          vendor/*/build-windows-x86_64
          vendor/lua/libluajit-*.a
          vendor/lz4/liblz4-*.a
          vendor/lua/src/luajit.h
          vendor/sqlvec/sqlite-vec.h
        key: vendor-${{ runner.os }}-llvm${{ inputs.llvm-version }}-${{ steps.vendor.outputs.sha }}

    # The checkout stamps every source with the current time and the cache restores outputs with the
    # time they were built, so rules that compare the two would rebuild everything the cache holds.
    - name: Mark restored vendor builds as current
      if: steps.vendor-cache.outputs.cache-hit == 'true'
      shell: bash
      run: find vendor/*/build-linux-x86_64 vendor/*/build-windows-x86_64 vendor/lua/libluajit-*.a vendor/lz4/liblz4-*.a vendor/lua/src/luajit.h vendor/sqlvec/sqlite-vec.h -exec touch {} + 2>/dev/null || true

    - name: Bootstrap build system
      shell: bash
      run: clang build.c -o build -std=c2y -mavx -mavx2 -fdefer-ts -fenable-matrix -Wno-initializer-overrides -Wno-gcc-compat -I./ -I./src -DNYA_NO_SDL -lm -pthread

    - name: Build vendored dependencies
      shell: bash
      run: ./build build vendor

    - name: Save vendor builds
      if: steps.vendor-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          vendor/*/build-linux-x86_64
          vendor/*/build-windows-x86_64
          vendor/lua/libluajit-*.a
          vendor/lz4/liblz4-*.a
          vendor/lua/src/luajit.h
          vendor/sqlvec/sqlite-vec.h
        key: ${{ steps.vendor-cache.outputs.cache-primary-key }}
