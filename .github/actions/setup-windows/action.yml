name: Setup (Windows)
description: Install build dependencies on a Windows runner, setup caching, bootstrap build system.

# The Windows counterpart to ../setup-linux. Split rather than branched because the two share
# nothing: that one is apt and apt.llvm.org, this one is MSYS2 and pacman, and a single action
# carrying both would be two scripts behind an `if` anyway.
#
# MSYS2's CLANG64 environment: it tracks LLVM releases quickly (the engine needs clang 22 for
# -fdefer-ts and -fenable-matrix), and the autotools vendors need `sh` and `make`. CLANG64 produces
# native UCRT binaries, so OS_WINDOWS is true and nothing is cross compiled.

inputs:
  llvm-version:
    description: LLVM major version to require. MSYS2 ships one clang; this asserts which.
    required: false
    default: "22"

runs:
  using: composite

  steps:
    - name: Install MSYS2 and the toolchain
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
      with:
        msystem: CLANG64
        update: true
        # pacman caching is handled by the action itself.
        cache: true
        # Build drivers come from the MSYS2 environment rather than CLANG64, since nothing links them.
        # gettext provides envsubst for sqlite-vec.h. tcl is for sqlite's autosetup: without a tclsh on
        # PATH it compiles its own jimsh with CLANG64 clang, and that native binary mangles the quoted
        # multi-line script autosetup pipes through `sh`.
        install: >-
          make
          git
          patch
          gettext
          tcl
        pacboy: >-
          clang:p
          lld:p
          cmake:p
          ninja:p
          pkg-config:p
          binutils:p

    # Through the environment rather than pasted into the script, for the reason setup-linux gives at
    # more length: a `${{ }}` in a `run:` block is expanded before the shell parses it, so an input is
    # source text rather than a value.
    - name: Verify the toolchain is what the build needs
      shell: msys2 {0}
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
      run: |
        clang --version
        ld.lld --version
        windres --version

        # Same assertion the Linux setup makes. -fdefer-ts (C2y defer) and -fenable-matrix do not
        # exist before clang 22, and without this a mismatch surfaces as a wall of parse errors in
        # engine headers rather than as "your compiler is too old".
        clang --version | grep -q "clang version ${LLVM_VERSION}\." \
          || { echo "::error::clang is not LLVM ${LLVM_VERSION}"; exit 1; }

    - name: Compute vendor cache key
      id: vendor
      shell: msys2 {0}
      run: |
        # Every submodule revision, plus the recipes and toolchains that configure them, since a
        # changed cmake flag produces a different archive from identical sources.
        revisions="$(git submodule status --recursive vendor)"
        recipes="$(find src/build/vendor src/build/on_linux src/build/on_windows -type f -name '*.h' -print0 | sort -z | xargs -0 sha256sum)"
        sha="$(printf '%s\n%s' "${revisions}" "${recipes}" | sha256sum | cut -d' ' -f1)"
        echo "sha=${sha}" >> "$GITHUB_OUTPUT"

    # Restored here and saved right after the vendor build, not at job end, so a failing test or a
    # cancelled run still keeps the vendors it built.
    - name: Restore vendor builds
      id: vendor-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        # A Windows host builds Windows targets only; shadercross lands in a directory named for this
        # host. luajit.h and sqlite-vec.h are generated and untracked, and cached with the archives.
        path: |
          vendor/*/build-windows-x86_64
          vendor/lua/libluajit-windows.a
          vendor/lz4/liblz4-windows.a
          vendor/lua/src/luajit.h
          vendor/sqlvec/sqlite-vec.h
        key: vendor-${{ runner.os }}-llvm${{ inputs.llvm-version }}-${{ steps.vendor.outputs.sha }}

    # The checkout stamps every source with the current time and the cache restores outputs with the
    # time they were built, so rules that compare the two would rebuild everything the cache holds.
    - name: Mark restored vendor builds as current
      if: steps.vendor-cache.outputs.cache-hit == 'true'
      shell: msys2 {0}
      run: find vendor/*/build-windows-x86_64 vendor/lua/libluajit-windows.a vendor/lz4/liblz4-windows.a vendor/lua/src/luajit.h vendor/sqlvec/sqlite-vec.h -exec touch {} + 2>/dev/null || true

    - name: Bootstrap build system
      shell: msys2 {0}
      # -o build.exe: host.h names BUILD_TOOL_BINARY "build.exe" and nya_rebuild_yourself compiles
      # over that name. Any other name would leave a stale binary re-executing itself.
      run: clang build.c -o build.exe -std=c2y -mavx -mavx2 -fdefer-ts -fenable-matrix -Wno-initializer-overrides -Wno-gcc-compat -I./ -I./src -DNYA_NO_SDL -lm -pthread

    - name: Build vendored dependencies
      shell: msys2 {0}
      run: ./build.exe build vendor

    - name: Save vendor builds
      if: steps.vendor-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          vendor/*/build-windows-x86_64
          vendor/lua/libluajit-windows.a
          vendor/lz4/liblz4-windows.a
          vendor/lua/src/luajit.h
          vendor/sqlvec/sqlite-vec.h
        key: ${{ steps.vendor-cache.outputs.cache-primary-key }}
